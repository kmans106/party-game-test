services:
  - type: web
    runtime: node
    name: party-game-api
    plan: free
    region: oregon
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    startCommand: npm run start --workspace @party-game/server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ALLOWED_ORIGIN
        sync: false

  - type: web
    runtime: static
    name: party-game-web
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    staticPublishPath: packages/client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_SERVER_URL
        sync: false
